<!doctype html>

<html lang="de">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

    overflow: hidden;
    position: relative;
    font-family: Raleway, "Open Sans", "DejaVu Sans", "Segoe UI", Arial, sans-serif;
    background:
      linear-gradient(#e7eeee 1px, transparent 1px) 0 -1px / 57px 57px,
      linear-gradient(90deg, #e7eeee 1px, transparent 1px) -1px 0 / 57px 57px,
      #f5f8f8;
  }
  .mark {
    position: absolute; left: 69px; top: 68px;
    width: 76px; height: 76px; border-radius: 22px;
    background: #2F99A4;
  }
  .bar {
    position: absolute; left: 69px; top: 160px;
    width: 81px; height: 10px;
    background: #FF4D00;
  }
  h1 {
    position: absolute; left: 66px; top: 200px;
    font-size: 67px; font-weight: 800; letter-spacing: -1px;
    color: #3b3e46;
  }
  .sub {
    position: absolute; left: 69px; top: 288px;
    font-size: 30px; font-weight: 700; letter-spacing: .3px;
    color: #1c8894;
  }
  .flow {
    position: absolute; left: 69px; top: 355px;
    font-size: 27px; color: #585961;
  }
  .flow span { color: #6d7078; padding: 0 10px; }
  .card {
    position: absolute; left: 70px; right: 70px; top: 490px;
    height: 77px; border-radius: 17px;
    background: #ffffff; border: 1px solid #d7dbdb;
    display: flex; align-items: center; gap: 30px;
    padding: 0 34px;
  }
  .card b { font-size: 22px; font-weight: 700; color: #3b3e46; white-space: nowrap; }
  .card i { font-style: normal; font-size: 25px; color: #585961; white-space: nowrap; }
  .foot {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 8px; background: #2F99A4;
  }

</head>
<body>
  <div class="mark"></div>
  <div class="bar"></div>
  <h1>Agent Engineering</h1>

  <div class="flow">Learning <span>→</span> Skills <span>→</span> Verification <span>→</span> Enforcement</div>
